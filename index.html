<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090a0f">
<meta name="description" content="PEDRO GEN - Password, Username, Email and Gaming Name Generator">
<title>PEDRO GEN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="background-glow glow-one"></div>
<div class="background-glow glow-two"></div>

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">P</div>
    <div><h1>PEDRO GEN</h1><span>Smart Generators</span></div>
  </div>
  <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">☼</button>
</header>

<main>
<section class="hero">
  <div class="hero-badge"><span class="status-dot"></span>PEDRO GEN</div>
  <h2>Generate <span>Anything.</span></h2>
  <p>Powerful generators for passwords, usernames, emails and gaming names — all in one place.</p>
</section>

<section class="generators">
  <button class="generator-card active" data-generator="password"><div class="card-icon">🔐</div><div class="card-content"><h3>Password</h3><p>Strong & secure passwords</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="instagram"><div class="card-icon">◎</div><div class="card-content"><h3>Instagram</h3><p>Creative username ideas</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="telegram"><div class="card-icon">➤</div><div class="card-content"><h3>Telegram</h3><p>Unique username ideas</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="tiktok"><div class="card-icon">♪</div><div class="card-content"><h3>TikTok</h3><p>Modern username ideas</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="email"><div class="card-icon">✉</div><div class="card-content"><h3>Email</h3><p>Generate email ideas</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="freefire"><div class="card-icon">🔥</div><div class="card-content"><h3>Free Fire</h3><p>Stylish gaming names</p></div><div class="arrow">›</div></button>
  <button class="generator-card" data-generator="pubg"><div class="card-icon">🎮</div><div class="card-content"><h3>PUBG</h3><p>Powerful gaming names</p></div><div class="arrow">›</div></button>
</section>

<section class="generator-panel">
  <div class="panel-header">
    <div><span class="small-title">GENERATOR</span><h2 id="generatorTitle">Password Generator</h2></div>
    <div class="panel-icon" id="panelIcon">🔐</div>
  </div>

  <div id="passwordOptions" class="options">
    <div class="option-row">
      <div><strong>Password Length</strong><span>Choose password length</span></div>
      <div class="length-value"><span id="lengthValue">18</span></div>
    </div>
    <input type="range" id="passwordLength" min="8" max="64" value="18">
    <div class="checkbox-grid">
      <label class="check-card"><input type="checkbox" id="uppercase" checked><span>ABC</span>Uppercase</label>
      <label class="check-card"><input type="checkbox" id="lowercase" checked><span>abc</span>Lowercase</label>
      <label class="check-card"><input type="checkbox" id="numbers" checked><span>123</span>Numbers</label>
      <label class="check-card"><input type="checkbox" id="symbols" checked><span>#$@</span>Symbols</label>
    </div>
  </div>

  <div id="usernameOptions" class="options hidden">
    <label class="input-label">Optional Name<input type="text" id="nameInput" placeholder="e.g. Pedro" maxlength="20"></label>
    <label class="input-label">Username Style<select id="usernameStyle"><option value="random">Random</option><option value="clean">Clean</option><option value="short">Short</option><option value="dark">Dark</option><option value="gaming">Gaming</option></select></label>
  </div>

  <div id="emailOptions" class="options hidden">
    <label class="input-label">Optional Name<input type="text" id="emailName" placeholder="e.g. Pedro" maxlength="20"></label>
    <label class="input-label">Email Style<select id="emailStyle"><option value="random">Random</option><option value="professional">Professional</option><option value="gaming">Gaming</option><option value="numbers">Numbers</option></select></label>
  </div>

  <div class="result-box">
    <div class="result-top"><span>RESULT</span><button id="copyBtn">Copy</button></div>
    <div class="result-value" id="result">Click Generate</div>
    <div id="strengthBox" class="strength-box">
      <div class="strength-header"><span>Password Strength</span><strong id="strengthText">—</strong></div>
      <div class="strength-bar"><div id="strengthBar"></div></div>
    </div>
  </div>
  <button class="generate-btn" id="generateBtn"><span>⚡</span> Generate</button>
</section>
</main>

<nav class="bottom-nav">
  <button class="nav-item active" data-scroll="home"><span>⌂</span>Home</button>
  <button class="nav-item" data-scroll="generator"><span>✦</span>Generate</button>
  <button class="nav-item" id="navTheme"><span>☼</span>Theme</button>
</nav>
<div id="toast" class="toast">Copied!</div>
<script src="script.js"></script>
</body>
</html>
